name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

# One job per guardrail, so each shows as its own check on a pull request.
# Everything runs on one Elixir, the one .tool-versions and the Dockerfile use.
#
# Every image is pinned to a digest, so a moved tag cannot change what CI runs
# in; the "Pinned images" job enforces that. Bump the digests here together
# with the Dockerfile's (which Dependabot proposes); read a new one with
# `docker buildx imagetools inspect <name>:<tag>`.
jobs:
  pinned-images:
    name: Pinned images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: .github/scripts/check_pinned_images.sh

  format:
    name: Formatting
    runs-on: ubuntu-latest
    container: elixir:1.20.5-otp-28@sha256:9deb9fe8bf7c8cfa02bd3b7b6b1932fbb9c313151eb1e76eba112fdde7628337
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: mix-1.20-${{ hashFiles('mix.lock') }}
      - run: mix local.hex --force && mix local.rebar --force
      # The formatter loads plugins from deps (Phoenix's HEEx formatter).
      - run: mix deps.get
      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    container: elixir:1.20.5-otp-28@sha256:9deb9fe8bf7c8cfa02bd3b7b6b1932fbb9c313151eb1e76eba112fdde7628337
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: mix-1.20-${{ hashFiles('mix.lock') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix credo --strict

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    container: elixir:1.20.5-otp-28@sha256:9deb9fe8bf7c8cfa02bd3b7b6b1932fbb9c313151eb1e76eba112fdde7628337
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: mix-1.20-${{ hashFiles('mix.lock') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: priv/plts
          key: plts-1.20-${{ hashFiles('mix.lock') }}
          restore-keys: plts-1.20-
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix dialyzer --format github

  test:
    name: Tests
    runs-on: ubuntu-latest
    container: elixir:1.20.5-otp-28@sha256:9deb9fe8bf7c8cfa02bd3b7b6b1932fbb9c313151eb1e76eba112fdde7628337
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: mix-1.20-${{ hashFiles('mix.lock') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - name: Compile with warnings as errors (Boundary included)
        run: mix compile --warnings-as-errors
      - run: mix test

  docker:
    name: Release image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t hcp-conformance .
      - name: Run the suite from the image against its own reference implementation
        run: |
          docker run -d --name hcpc --network host \
            -e PORT=4000 -e BIND_ADDRESS=0.0.0.0 -e SECRET_KEY_BASE="$(openssl rand -base64 64 | tr -d '\n')" \
            -e PHX_HOST=127.0.0.1 -e PHX_URL_SCHEME=http -e PHX_URL_PORT=4000 -e ALLOW_PRIVATE_TARGETS=true \
            hcp-conformance
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/health && break; sleep 1; done
          docker run --rm --network host hcp-conformance bin/conformance \
            --target http://127.0.0.1:4000/reference \
            --hook-url http://127.0.0.1:4000/reference/conformance-hook \
            --hook-secret reference-hook-secret --allow-private --strict
