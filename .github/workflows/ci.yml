name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

# A build job fetches and compiles once (Boundary runs inside compile), then
# each guardrail restores that build and runs only its own tool, so every one
# still shows as its own check on a pull request without compiling again. The
# build is cached under the commit, so the checks restore exactly what the
# build job made; the lockfile key underneath lets a new commit start from the
# previous build and recompile only what changed.
#
# Every image is pinned to a digest, so a moved tag cannot change what CI runs
# in; the "Pinned images" job enforces that. The runner is a named Ubuntu
# release rather than ubuntu-latest, so it moves when we move it. Bump the digest here together
# with the Dockerfile's (which Dependabot proposes); read a new one with
# `docker buildx imagetools inspect <name>:<tag>`.
jobs:
  pinned-images:
    name: Pinned images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/check_pinned_images.sh

  build:
    name: Build
    runs-on: ubuntu-24.04
    container: elixir:1.20.5-otp-28@sha256:9deb9fe8bf7c8cfa02bd3b7b6b1932fbb9c313151eb1e76eba112fdde7628337
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: mix-${{ hashFiles('mix.lock') }}-
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - name: Compile with warnings as errors (Boundary included)
        run: mix compile --warnings-as-errors

  format:
    name: Formatting
    needs: build
    runs-on: ubuntu-24.04
    container: elixir:1.20.5-otp-28@sha256:9deb9fe8bf7c8cfa02bd3b7b6b1932fbb9c313151eb1e76eba112fdde7628337
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: mix local.hex --force && mix local.rebar --force
      # The formatter loads plugins from deps (Phoenix's HEEx formatter).
      - run: mix format --check-formatted

  credo:
    name: Credo
    needs: build
    runs-on: ubuntu-24.04
    container: elixir:1.20.5-otp-28@sha256:9deb9fe8bf7c8cfa02bd3b7b6b1932fbb9c313151eb1e76eba112fdde7628337
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix credo --strict

  dialyzer:
    name: Dialyzer
    needs: build
    runs-on: ubuntu-24.04
    container: elixir:1.20.5-otp-28@sha256:9deb9fe8bf7c8cfa02bd3b7b6b1932fbb9c313151eb1e76eba112fdde7628337
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true
      # The PLTs depend on the dependency set, not the commit, so they keep
      # their own cache and are rebuilt only when the lockfile changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plts-${{ hashFiles('mix.lock') }}
          restore-keys: plts-
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix dialyzer --format github

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-24.04
    container: elixir:1.20.5-otp-28@sha256:9deb9fe8bf7c8cfa02bd3b7b6b1932fbb9c313151eb1e76eba112fdde7628337
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix test

  # Last: an image of code the tests reject is not worth building.
  docker:
    name: Release image smoke test
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t hcp-conformance .
      - name: Run the suite from the image against its own reference implementation
        run: |
          docker run -d --name hcpc --network host \
            -e PORT=4000 -e BIND_ADDRESS=0.0.0.0 -e SECRET_KEY_BASE="$(openssl rand -base64 64 | tr -d '\n')" \
            -e PHX_HOST=127.0.0.1 -e PHX_URL_SCHEME=http -e PHX_URL_PORT=4000 -e ALLOW_PRIVATE_TARGETS=true \
            hcp-conformance
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/health && break; sleep 1; done
          docker run --rm --network host hcp-conformance bin/conformance \
            --target http://127.0.0.1:4000/reference \
            --hook-url http://127.0.0.1:4000/reference/conformance-hook \
            --hook-secret reference-hook-secret --allow-private --strict
