name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir: ["1.18", "1.20"]
    container: elixir:${{ matrix.elixir }}
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plts-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: plts-${{ matrix.elixir }}-
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - name: Compile, with Boundary's cross-boundary checks
        run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test
      - run: mix dialyzer --format github

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hcp-conformance .
      - name: Smoke test the image against its own reference implementation
        run: |
          docker run -d --name hcpc --network host \
            -e PORT=4000 -e BIND_ADDRESS=0.0.0.0 -e SECRET_KEY_BASE="$(openssl rand -base64 64 | tr -d '\n')" \
            -e PHX_HOST=127.0.0.1 -e PHX_URL_SCHEME=http -e PHX_URL_PORT=4000 -e ALLOW_PRIVATE_TARGETS=true \
            hcp-conformance
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/health && break; sleep 1; done
          docker run --rm --network host hcp-conformance bin/conformance \
            --target http://127.0.0.1:4000/reference \
            --hook-url http://127.0.0.1:4000/reference/conformance-hook \
            --hook-secret reference-hook-secret --allow-private --strict
