name: Release image

# Publishing a GitHub release (or turning a pre-release into a release) builds
# the release image and pushes it to Turn's Artifact Registry, tagged with the
# release tag, for the Kubernetes deployment to pull. It authenticates keylessly
# through Workload Identity Federation as the gh-build service account, which
# turnhub/turnio-deploys (makefile_helpers/bootstrap-hyperscaler.sh, tooling
# mode) trusts from this repository.
on:
  release:
    types: [released]

jobs:
  build-and-push-image:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NAME: hcp-conformance
      REGISTRY: europe-west3-docker.pkg.dev/turn-tooling/turnhub/
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth-gcp
        with:
          workload_identity_provider: "projects/669832244717/locations/global/workloadIdentityPools/gh-actions-cd-pool/providers/github-actions"
          service_account: "gh-build@turn-tooling.iam.gserviceaccount.com"
          token_format: "access_token"
          access_token_lifetime: "1800s"
      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth-gcp.outputs.access_token }}
      - name: Build and push the image
        run: |
          echo "Building and pushing ${REGISTRY}${IMAGE_NAME}:${VERSION}"
          docker buildx create --name build_images_builder --driver docker-container || true
          docker buildx use build_images_builder
          docker buildx build \
            --builder build_images_builder \
            --cache-to=type=registry,ref=${REGISTRY}cache:${IMAGE_NAME},mode=max \
            --cache-from=type=registry,ref=${REGISTRY}cache:${IMAGE_NAME} \
            --tag ${REGISTRY}${IMAGE_NAME}:${VERSION} \
            --file Dockerfile \
            --push \
            .
