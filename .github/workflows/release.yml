name: Release image

# Publishing a GitHub release (or turning a pre-release into a release) builds
# the release image and pushes it to a Google Artifact Registry, tagged with the
# release tag, for a Kubernetes deployment to pull. It authenticates keylessly
# through Workload Identity Federation, so no key is stored in GitHub.
#
# Where it pushes is set in repository variables (Settings → Secrets and
# variables → Actions → Variables), so a fork publishes to its own registry:
#
#   GCP_REGISTRY               europe-west3-docker.pkg.dev/<project>/<repository>/
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#                              projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT        <name>@<project>.iam.gserviceaccount.com
#
# The provider must trust this repository, and the service account needs
# Artifact Registry Writer on the repository.
on:
  release:
    types: [released]

jobs:
  build-and-push-image:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NAME: hcp-conformance
      REGISTRY: ${{ vars.GCP_REGISTRY }}
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the registry variables are set
        id: registry
        run: |
          for name in GCP_REGISTRY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set; see the comment at the top of release.yml"
              exit 1
            fi
          done
          echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
        env:
          GCP_REGISTRY: ${{ vars.GCP_REGISTRY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth-gcp
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: "access_token"
          access_token_lifetime: "1800s"
      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth-gcp.outputs.access_token }}
      - name: Build and push the image
        run: |
          echo "Building and pushing ${REGISTRY}${IMAGE_NAME}:${VERSION}"
          docker buildx create --name build_images_builder --driver docker-container || true
          docker buildx use build_images_builder
          docker buildx build \
            --builder build_images_builder \
            --cache-to=type=registry,ref=${REGISTRY}cache:${IMAGE_NAME},mode=max \
            --cache-from=type=registry,ref=${REGISTRY}cache:${IMAGE_NAME} \
            --tag ${REGISTRY}${IMAGE_NAME}:${VERSION} \
            --file Dockerfile \
            --push \
            .
