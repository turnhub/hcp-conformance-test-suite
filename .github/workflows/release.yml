name: Release image

# Publishing a GitHub release (or turning a pre-release into a release) builds
# the release image and pushes it to Turn's Artifact Registry, tagged with the
# release tag, for the Kubernetes deployment to pull. Same setup as
# turnhub/forwarder.
on:
  release:
    types: [released]

jobs:
  build-and-push-image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NAME: hcp-conformance
      REGISTRY: europe-west3-docker.pkg.dev/turn-tooling/turnhub/
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        id: auth-gcp
        with:
          workload_identity_provider: "projects/669832244717/locations/global/workloadIdentityPools/github-identity-pool/providers/github-identity-pool-provider"
          service_account: "github-actions-secrets@turn-tooling.iam.gserviceaccount.com"
          token_format: "access_token"
          access_token_lifetime: "1800s"
      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth-gcp.outputs.access_token }}
      - name: Build and push the image
        run: |
          echo "Building and pushing ${REGISTRY}${IMAGE_NAME}:${VERSION}"
          docker buildx create --name build_images_builder --driver docker-container || true
          docker buildx use build_images_builder
          docker buildx build \
            --builder build_images_builder \
            --cache-to=type=registry,ref=${REGISTRY}cache:${IMAGE_NAME},mode=max \
            --cache-from=type=registry,ref=${REGISTRY}cache:${IMAGE_NAME} \
            --tag ${REGISTRY}${IMAGE_NAME}:${VERSION} \
            --file Dockerfile \
            --push \
            .
